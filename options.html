<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piko Options</title>
    <link rel="stylesheet" href="styles/options.css">
  </head>
  <body>
    <main class="options">
      <header class="options__header">
        <img src="icons/piko-browser-logo.svg" alt="">
        <div>
          <h1>Piko</h1>
          <p>Lightweight controls for Instagram and YouTube.</p>
        </div>
      </header>

      <section class="settings-list" aria-label="Piko settings">
        <label class="setting-row setting-row--stacked">
          <span>
            <strong>Filename preset</strong>
            <small>Choose a ready-made pattern or switch to custom.</small>
          </span>
          <select id="filenamePreset"></select>
        </label>

        <label class="setting-row setting-row--stacked">
          <span>
            <strong>Filename pattern</strong>
            <small>Use {username}, {takenAt}, {id}, {type}, and {index}.</small>
          </span>
          <input id="filenamePattern" type="text" spellcheck="false">
        </label>

        <label class="setting-row">
          <span>
            <strong>Resolution notices</strong>
            <small>Show brief toasts when media resolution falls back or health checks report an issue.</small>
          </span>
          <input id="showReliabilityToasts" type="checkbox">
        </label>

        <label class="setting-row">
          <span>
            <strong>Keyboard shortcuts</strong>
            <small>When enabled: S saves current item, A toggles Select mode. Ignored while typing.</small>
          </span>
          <input id="enableKeyboardShortcuts" type="checkbox">
        </label>

        <label class="setting-row">
          <span>
            <strong>Instagram page menu</strong>
            <small>Show Piko’s compact bottom menu in the Instagram feed.</small>
          </span>
          <input id="showFeedButton" type="checkbox">
        </label>

        <div class="setting-row" aria-labelledby="selectedFolderLabel">
          <span>
            <strong id="selectedFolderLabel">Download folder</strong>
            <small id="selectedFolder">Browser downloads</small>
          </span>
        </div>
      </section>

      <footer class="options__footer">
        <p>Primary actions stay on Instagram and YouTube.</p>
        <p id="status" class="status" aria-live="polite">Ready</p>
      </footer>
    </main>
    <script src="src/shared/messages.js"></script>
    <script src="src/shared/settingsStore.js"></script>
    <script src="src/options/options.js"></script>
  </body>
</html>
